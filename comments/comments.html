<html>
    <head>
        <meta lang='en-US'>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>Leave a Comment!</title>
        <link rel="stylesheet" type="text/css" href="/php_Calculator/css/calculator.css" />
        <link rel='stylesheet' type='text/css' href='/php_Calculator/css/comments.css'>
        <link rel="stylesheet" href="/php_Calculator/css/header.css" type="text/css" media="" title="" charset="" />
        <!--
        <link rel="stylesheet" type="text/css" href="/php_Calculator/css/DataGridView.css" />
        -->
    </head>
    <body>
        <div id='maindisplay'>
            <div class='Head-Column'>
                <h1 class='mainHeader'><img id='mainlogo' align='center' src='/php_Calculator/images/massive01.svg' alt='Massive Calculator'> The Massive Calculator!</h1>
            </div>
            <div class='Head-Column'>
                <div class='menuItem'>
                    <a id='tabitem' href='/php_Calculator/about/about.php'>About</a>
                    <a id='tabitem' href='/php_Calculator/index.php'>Instructions</a>
                    <a id='tabitem' href='/php_Calculator/calculator_front.php'>Back to Calculator</a>
                    <a id='tabitem' href='/php_Calculator/f_suggestions/suggestion_r.php'>Suggest a Formula</a>
                </div>
            </div>
        </div>   
        <h2 class='disclaimer'>--Disclaimer--</h2>
        <h3 class='description'>All comments are subject to monitoring and may be deleted by staff.
            Please limit comments to being constructive and applicable to the
            product. Thank You.</h3>
        <form id='userform' action='/php_Calculator/comments/comments_c.php' method='post'>
            <div class="column">
                <p class='titles'>First Name:</p>
                <input type='text' id='fname' name='fname' required>
                <p class='titles'>Last Name:</p>
                <input type="text" name="lname" value="" required/><br>
            </div>
            <div class='column'>
                <p class='titles'>Comment: </p>
                <textarea class='comments' id='comment' name='comment' placeholder='Comment Here...' maxlength='500' required></textarea>
                {INSERT}
            </div>
            <div class='column'>
                <input type='submit' value='Submit'><br>
            </div>
        </form>
    </body>
</html>
